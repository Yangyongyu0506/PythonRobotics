[project]
name = "pythonrobotics"
version = "0.0.0"
description = "Python codes and textbook for robotics algorithms."
requires-python = ">=3.13,<3.14"
dependencies = [
  "numpy==2.3.5",
  "scipy==1.18.1",
  "matplotlib==3.11.0",
  "cvxpy==1.8.1",
  "ecos==2.0.14",
]

[dependency-groups]
dev = [
  "pytest==9.1.0",
  "pytest-xdist==3.8.0",
  "mypy==1.19.1",
  "ruff==0.16.5",
]

[tool.uv]
package = false